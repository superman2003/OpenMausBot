name: Release Windows to personal repository

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified release immediately (otherwise create a draft)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-windows-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'superman2003/OpenMausBot'
    uses: ./.github/workflows/package-win.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: release
      - run: node scripts/verify-windows-release.mjs
      - name: Create and upload the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Bump package.json before releasing again."
            exit 1
          fi
          printf 'Windows x64 personal build. Updates follow %s Releases.\n\nSource commit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          cd release
          sha256sum "OpenMausBot-$version-setup.exe" "OpenMausBot-$version-setup.exe.blockmap" latest.yml > SHA256SUMS-windows-x64.txt
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenMausBot $version" --notes-file "$RUNNER_TEMP/release-notes.md" --draft \
            "OpenMausBot-$version-setup.exe" "OpenMausBot-$version-setup.exe.blockmap" latest.yml SHA256SUMS-windows-x64.txt
          if [ "$PUBLISH" = true ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
